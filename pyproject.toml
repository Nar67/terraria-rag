[project]
name = "terraria-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.16",
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "lxml>=6.1.3",
    "openai>=3.51.0",
    "pystemmer>=3.1.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# The scripts live in the project root and import each other by module name.
pythonpath = ["."]
testpaths = ["tests"]
